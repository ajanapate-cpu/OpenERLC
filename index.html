<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenERLC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1 class="brand">Open<span>ERLC</span></h1><span class="sub">ERLCPEDIA · ASK ANYTHING ABOUT LIBERTY COUNTY</span></div>
    <div class="top-actions">
      <button class="ghost" id="about" type="button">About website</button>
      <button class="ghost" id="reset" type="button">New chat</button>
    </div>
  </div>
  <div class="about-backdrop" id="about-backdrop" hidden>
    <section class="about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <button class="about-close" id="about-close" type="button" aria-label="Close about website">×</button>
      <h2 id="about-title">About website</h2>
      <ul class="about-list">
        <li>Developed By AJ</li>
        <li>Aim To make ERLC A Easy understanding Game for Beginners.</li>
        <li><strong id="visit-count">Loading...</strong> Visits</li>
        <li>Discord server coming soon.</li>
      </ul>
    </section>
  </div>
  <div class="stream" id="stream" aria-live="polite"></div>
  <div class="composer">
    <div class="box">
      <textarea id="in" rows="1" placeholder="Ask about ER:LC: ranks, commands, the API, rules..." aria-label="Ask a question"></textarea>
      <button class="send" id="send" type="button">Ask</button>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</div>
<script src="knowledge.js"></script>
<script src="app.js"></script>
</body>
</html>
